services:
  - type: web
    name: multihost-link-inspector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MAX_CONCURRENT
        value: "5"
      - key: REQUEST_TIMEOUT
        value: "20"
      - key: MAX_REDIRECTS
        value: "8"
      - key: MAX_LINKS
        value: "12"
      - key: CACHE_TTL
        value: "600"
      - key: USER_COOLDOWN
        value: "3"

