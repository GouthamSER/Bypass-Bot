definition:
  name: multihost-link-inspector
  type: web
  regions:
    - fra
  routes:
    - path: /
      port: 8080
  ports:
    - port: 8080
      path: /health
      protocol: http
  env:
    - key: PORT
      value: "8080"
    - key: API_ID
      value: ""
    - key: API_HASH
      value: ""
    - key: BOT_TOKEN
      value: ""
    - key: MAX_CONCURRENT
      value: "5"
    - key: REQUEST_TIMEOUT
      value: "20"

